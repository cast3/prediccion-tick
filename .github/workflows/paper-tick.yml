name: paper-tick
on:
  schedule:
    # Desfasado 2 min del minuto 0: GitHub retrasa los cron en punto.
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Llamar al tick de producción
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          if [ -z "${APP_URL}" ]; then echo "::error::Falta el secreto APP_URL"; exit 1; fi
          if [ -z "${CRON_SECRET}" ]; then echo "::error::Falta el secreto CRON_SECRET"; exit 1; fi
          case "${APP_URL}" in https://*) ;; *) echo "::error::APP_URL debe empezar por https://"; exit 1;; esac
          tmp=$(mktemp)
          code=$(curl -sS --retry 3 --retry-all-errors --retry-delay 10 --max-time 70 \
            -o "$tmp" -w "%{http_code}" \
            -H "Authorization: Bearer ${CRON_SECRET}" "${APP_URL%/}/api/paper/tick") || {
            echo "::error::curl falló (HTTP ${code:-n/a})"
            rm -f "$tmp"
            exit 1
          }
          echo "http=$code bytes=$(wc -c < "$tmp")"
          if [ "$code" != "200" ]; then echo "::error::HTTP $code"; rm -f "$tmp"; exit 1; fi
          grep -q '"checked"' "$tmp" || { echo "::error::Respuesta inesperada del tick"; rm -f "$tmp"; exit 1; }
          rm -f "$tmp"
          echo OK
